[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  SECRETS_SCAN_OMIT_KEYS = "NEXT_PUBLIC_SUPABASE_URL,NEXT_PUBLIC_SUPABASE_ANON_KEY,NEXT_PUBLIC_APP_URL,ADMIN_CODE,EMAIL_HOST,EMAIL_PORT,EMAIL_SECURE,EMAIL_USER,EMAIL_PASS,EMAIL_FROM"

[[plugins]]
  package = "@netlify/plugin-nextjs"
